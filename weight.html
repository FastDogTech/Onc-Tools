<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weight Calculator - Onc Tools</title>
<link rel="stylesheet" href="css/style.css">
<script src="js/state.js"></script>
<script src="js/ui.js"></script>
<script>initChrome();</script>
</head>
<body>
<div class="page">
  <div id="pageHeader"></div>
  <main>
    <div class="card">
      <div id="heightContainer"></div>
      <div id="weightContainer"></div>
      <div id="sexContainer"></div>
    </div>

    <div class="card">
      <div class="field-row">
        <div class="segmented-inline" id="segmented">
          <button data-type="Actual" type="button">Actual</button>
          <button data-type="Adjusted" type="button">Adjusted</button>
          <button data-type="Ideal" type="button">Ideal</button>
        </div>
        <strong id="weightTypeValue">0.0 kg</strong>
      </div>
    </div>

    <div class="card">
      <div class="field-row">
        <span class="field-label">Dose</span>
        <div class="field-input-group"><input class="num-input" id="doseInput" inputmode="decimal" placeholder="Dose"></div>
      </div>
      <div class="error-text" id="doseError" hidden></div>
    </div>

    <div class="card">
      <div class="result-row">
        <span>Result</span>
        <span class="value"><span id="calcResult">-</span></span>
      </div>
    </div>
    <div id="resetContainer"></div>
  </main>
</div>

<script>
renderHeader(document.getElementById('pageHeader'), { active: 'weight' });
renderResetButton(document.getElementById('resetContainer'), () => { Patient.reset(); });

const heightContainer = document.getElementById('heightContainer');
const weightContainer = document.getElementById('weightContainer');
const sexContainer = document.getElementById('sexContainer');
const weightTypeValue = document.getElementById('weightTypeValue');
const doseInput = document.getElementById('doseInput');
const calcResult = document.getElementById('calcResult');
const doseError = document.getElementById('doseError');
const segmentedButtons = document.querySelectorAll('#segmented button');

let selectedType = 'Actual';
let dose = null;
let sexWidget = null;

function currentWeightKg() {
  if (selectedType === 'Ideal') return Formulas.idealBodyWeight(Patient.height, Patient.sex);
  if (selectedType === 'Adjusted') return Formulas.adjustedBodyWeight(Patient.weight ?? 0, Formulas.idealBodyWeight(Patient.height, Patient.sex));
  return Patient.weight ?? 0;
}

function recalc() {
  const weightKg = currentWeightKg();
  const display = UnitManager.convertWeightToDisplay(weightKg) ?? 0;
  weightTypeValue.textContent = display.toFixed(1) + ' ' + UnitManager.weightUnitLabel;

  segmentedButtons.forEach(btn => btn.classList.toggle('active', btn.dataset.type === selectedType));

  if (dose !== null && weightKg > 0) {
    calcResult.textContent = (dose * display).toFixed(1);
  } else {
    calcResult.textContent = '-';
  }
}

segmentedButtons.forEach(btn => {
  btn.addEventListener('click', () => {
    selectedType = btn.dataset.type;
    recalc();
  });
});

doseInput.addEventListener('input', () => {
  const value = parseNum(doseInput.value);
  if (value !== null) {
    if (value < 0) {
      setError(doseError, 'Dose cannot be negative');
      dose = null;
    } else if (value > 10000) {
      setError(doseError, 'Dose must be less than 10,000');
      dose = null;
    } else if (!Number.isFinite(value)) {
      setError(doseError, 'Invalid number entered');
      dose = null;
    } else {
      setError(doseError, null);
      dose = value;
    }
  } else {
    setError(doseError, null);
    dose = null;
  }
  recalc();
});

renderHeightInput(heightContainer, recalc);
renderWeightInput(weightContainer, recalc);
sexWidget = renderSexToggle(sexContainer, recalc);
recalc();
</script>
</body>
</html>
