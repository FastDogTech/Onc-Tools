<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weight Calculator - Onc Tools</title>
<link rel="stylesheet" href="css/style.css">
<script src="js/state.js"></script>
<script src="js/ui.js"></script>
<script>initChrome();</script>
</head>
<body>
<div class="page">
  <header class="topbar">
    <a class="back" href="index.html">‹ Home</a>
    <h1>Weight Calculator</h1>
    <button class="reset-btn" id="resetBtn">Reset</button>
  </header>
  <main>
    <div class="card">
      <div class="card-header">Patient Information</div>
      <div id="heightContainer"></div>
      <div id="weightContainer"></div>
      <div id="sexContainer"></div>
    </div>

    <div class="card">
      <div class="field-row">
        <span class="field-label" id="weightTypeLabel">Actual Body Weight</span>
        <div class="field-input-group"><strong id="weightTypeValue">0.0 kg</strong></div>
      </div>
    </div>

    <div class="segmented" id="segmented">
      <button data-type="Actual" type="button">Actual</button>
      <button data-type="Adjusted" type="button">Adjusted</button>
      <button data-type="Ideal" type="button">Ideal</button>
    </div>

    <div class="card">
      <div class="card-header">Calculator</div>
      <div class="calc-row">
        <span id="calcWeight">0.0 kg</span>
        <span class="op">×</span>
        <input class="num-input" id="multiplierInput" inputmode="decimal" placeholder="Amount">
        <span class="op">=</span>
        <span class="result" id="calcResult">0.0</span>
      </div>
      <div class="error-text" id="multiplierError" hidden></div>
    </div>
  </main>
</div>

<script>
const heightContainer = document.getElementById('heightContainer');
const weightContainer = document.getElementById('weightContainer');
const sexContainer = document.getElementById('sexContainer');
const weightTypeLabel = document.getElementById('weightTypeLabel');
const weightTypeValue = document.getElementById('weightTypeValue');
const calcWeight = document.getElementById('calcWeight');
const multiplierInput = document.getElementById('multiplierInput');
const calcResult = document.getElementById('calcResult');
const multiplierError = document.getElementById('multiplierError');
const segmentedButtons = document.querySelectorAll('#segmented button');

let selectedType = 'Actual';
let multiplier = null;
let sexWidget = null;

function currentWeightKg() {
  if (selectedType === 'Ideal') return Formulas.idealBodyWeight(Patient.height, Patient.sex);
  if (selectedType === 'Adjusted') return Formulas.adjustedBodyWeight(Patient.weight ?? 0, Formulas.idealBodyWeight(Patient.height, Patient.sex));
  return Patient.weight ?? 0;
}

function refreshSexVisibility() {
  sexContainer.style.display = (selectedType === 'Ideal' || selectedType === 'Adjusted') ? '' : 'none';
}

function recalc() {
  const weightKg = currentWeightKg();
  const display = UnitManager.convertWeightToDisplay(weightKg) ?? 0;
  const label = selectedType + ' Body Weight';
  weightTypeLabel.textContent = label;
  weightTypeValue.textContent = display.toFixed(1) + ' ' + UnitManager.weightUnitLabel;
  calcWeight.textContent = display.toFixed(1) + ' ' + UnitManager.weightUnitLabel;

  segmentedButtons.forEach(btn => btn.classList.toggle('active', btn.dataset.type === selectedType));
  refreshSexVisibility();

  if (multiplier !== null && weightKg > 0) {
    calcResult.textContent = (multiplier * display).toFixed(1);
  } else {
    calcResult.textContent = '0.0';
  }
}

segmentedButtons.forEach(btn => {
  btn.addEventListener('click', () => {
    selectedType = btn.dataset.type;
    recalc();
  });
});

multiplierInput.addEventListener('input', () => {
  const value = parseNum(multiplierInput.value);
  if (value !== null) {
    if (value < 0) {
      setError(multiplierError, 'Multiplier cannot be negative');
      multiplier = null;
    } else if (value > 10000) {
      setError(multiplierError, 'Multiplier must be less than 10,000');
      multiplier = null;
    } else if (!Number.isFinite(value)) {
      setError(multiplierError, 'Invalid number entered');
      multiplier = null;
    } else {
      setError(multiplierError, null);
      multiplier = value;
    }
  } else {
    setError(multiplierError, null);
    multiplier = null;
  }
  recalc();
});

renderHeightInput(heightContainer, recalc);
renderWeightInput(weightContainer, recalc);
sexWidget = renderSexToggle(sexContainer, recalc);
recalc();

wireResetButton(document.getElementById('resetBtn'), () => {
  Patient.reset();
});
</script>
</body>
</html>
