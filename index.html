<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Onc Tools</title>
<meta name="description" content="Oncology clinical calculators: BSA, AUC, weight-based dosing, ANC, corrected calcium, creatinine clearance/eGFR, and a date finder.">
<link rel="stylesheet" href="css/style.css">
<link rel="icon" type="image/png" href="img/favicon-32.png">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Onc Tools">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#007AFF">
<script src="js/state.js"></script>
<script src="js/ui.js"></script>
<script>initChrome();</script>
</head>
<body>
<div class="page">
  <div id="pageHeader"></div>
  <main>
    <div class="card">
      <div id="heightContainer"></div>
      <div id="weightContainer"></div>
      <div class="field-row no-divider">
        <span class="field-label">BSA</span>
        <div class="field-input-group">
          <strong id="bsaValue">0.00 m²</strong>
          <button class="toggle-btn" id="formulaBtn" type="button"></button>
        </div>
      </div>
      <div class="field-row">
        <span class="field-label">Dose</span>
        <div class="field-input-group"><input class="num-input" id="doseInput" inputmode="decimal" placeholder="Dose"></div>
      </div>
      <div class="error-text" id="doseError" hidden></div>
    </div>

    <div class="card">
      <div class="result-row">
        <span>Result</span>
        <span class="value"><span id="calcResult">-</span></span>
      </div>
    </div>
    <p class="formula-note" id="formulaFooter"></p>
    <div id="resetContainer"></div>
    <div id="historyContainer"></div>
  </main>
</div>

<script>
renderHeader(document.getElementById('pageHeader'), { active: 'bsa' });

const heightContainer = document.getElementById('heightContainer');
const weightContainer = document.getElementById('weightContainer');
const formulaBtn = document.getElementById('formulaBtn');
const bsaValue = document.getElementById('bsaValue');
const formulaFooter = document.getElementById('formulaFooter');
const doseInput = document.getElementById('doseInput');
const calcResult = document.getElementById('calcResult');
const doseError = document.getElementById('doseError');

let selectedFormula = Settings.defaultBSAFormula;
let dose = null;

const FORMULA_STRINGS = {
  Dubois: 'm² = 0.007184 × (height^0.725) × (weight^0.425)',
  Mosteller: 'm² = √(height × weight) / 3600'
};

function currentBSA() {
  return selectedFormula === 'Dubois'
    ? Formulas.bsaDubois(Patient.height, Patient.weight)
    : Formulas.bsaMosteller(Patient.height, Patient.weight);
}

function recalc() {
  const bsa = currentBSA();
  bsaValue.textContent = bsa.toFixed(2) + ' m²';
  formulaBtn.textContent = selectedFormula;
  formulaFooter.textContent = selectedFormula + ': ' + FORMULA_STRINGS[selectedFormula];

  if (dose !== null && bsa > 0) {
    calcResult.textContent = (bsa * dose).toFixed(2);
  } else {
    calcResult.textContent = '-';
  }

  saveResetBar.refreshSaveState();
}

formulaBtn.addEventListener('click', () => {
  selectedFormula = selectedFormula === 'Dubois' ? 'Mosteller' : 'Dubois';
  recalc();
});

doseInput.addEventListener('input', () => {
  const value = parseNum(doseInput.value);
  if (value !== null) {
    if (value < 0) {
      setError(doseError, 'Dose cannot be negative');
      dose = null;
    } else if (value > 10000) {
      setError(doseError, 'Dose must be less than 10,000');
      dose = null;
    } else if (!Number.isFinite(value)) {
      setError(doseError, 'Invalid number entered');
      dose = null;
    } else {
      setError(doseError, null);
      dose = value;
    }
  } else {
    setError(doseError, null);
    dose = null;
  }
  recalc();
});

const heightWidget = renderHeightInput(heightContainer, recalc);
const weightWidget = renderWeightInput(weightContainer, recalc);

const historyCard = renderHistoryCard(document.getElementById('historyContainer'), {
  key: 'bsaHistory',
  columns: ['Ht', 'Wt', 'BSA', 'Dose', 'Calc'],
  formatRow(entry) {
    const h = UnitManager.convertHeightToDisplay(entry.height);
    const w = UnitManager.convertWeightToDisplay(entry.weight);
    return [
      h !== null ? h.toFixed(1) : '-',
      w !== null ? w.toFixed(1) : '-',
      entry.bsa.toFixed(2),
      entry.dose.toFixed(1),
      entry.calc.toFixed(2)
    ];
  },
  onRowClick(entry) {
    Patient.height = entry.height;
    Patient.weight = entry.weight;
    selectedFormula = entry.formula;
    dose = entry.dose;
    doseInput.value = String(entry.dose);
    heightWidget.refresh();
    weightWidget.refresh();
    recalc();
  }
});

const saveResetBar = renderSaveResetBar(document.getElementById('resetContainer'), {
  onSave() {
    const bsa = currentBSA();
    pushHistory('bsaHistory', {
      height: Patient.height,
      weight: Patient.weight,
      formula: selectedFormula,
      bsa,
      dose,
      calc: bsa * dose
    });
    historyCard.render();
  },
  onReset() { Patient.reset(); },
  canSave: () => dose !== null && currentBSA() > 0
});

recalc();
</script>
</body>
</html>
