<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BSA Calculator - Onc Tools</title>
<link rel="stylesheet" href="css/style.css">
<script src="js/state.js"></script>
<script src="js/ui.js"></script>
<script>initChrome();</script>
</head>
<body>
<div class="page">
  <header class="topbar">
    <a class="back" href="index.html">‹ Home</a>
    <h1>BSA Calculator</h1>
    <button class="reset-btn" id="resetBtn">Reset</button>
  </header>
  <main>
    <div class="card">
      <div id="heightContainer"></div>
      <div id="weightContainer"></div>
      <div class="field-row">
        <span class="field-label">BSA Formula</span>
        <div class="field-input-group"><button class="toggle-btn" id="formulaBtn" type="button"></button></div>
      </div>
      <div class="field-row">
        <span class="field-label">BSA</span>
        <div class="field-input-group"><strong id="bsaValue">0.00 m²</strong></div>
      </div>
      <div class="card-footer" id="formulaFooter"></div>
    </div>

    <div class="card">
      <div class="card-header">Calculator</div>
      <div class="calc-row">
        <span id="calcBsa">0.00 m²</span>
        <span class="op">×</span>
        <input class="num-input" id="amountInput" inputmode="decimal" placeholder="Amount">
        <span class="op">=</span>
        <span class="result" id="calcResult">-</span>
      </div>
      <div class="error-text" id="amountError" hidden></div>
    </div>
  </main>
</div>

<script>
const heightContainer = document.getElementById('heightContainer');
const weightContainer = document.getElementById('weightContainer');
const formulaBtn = document.getElementById('formulaBtn');
const bsaValue = document.getElementById('bsaValue');
const formulaFooter = document.getElementById('formulaFooter');
const calcBsa = document.getElementById('calcBsa');
const amountInput = document.getElementById('amountInput');
const calcResult = document.getElementById('calcResult');
const amountError = document.getElementById('amountError');

let selectedFormula = Settings.defaultBSAFormula;
let amount = null;

const FORMULA_STRINGS = {
  Dubois: 'm² = 0.007184 × (height^0.725) × (weight^0.425)',
  Mosteller: 'm² = √(height × weight) / 3600'
};

function currentBSA() {
  return selectedFormula === 'Dubois'
    ? Formulas.bsaDubois(Patient.height, Patient.weight)
    : Formulas.bsaMosteller(Patient.height, Patient.weight);
}

function recalc() {
  const bsa = currentBSA();
  bsaValue.textContent = bsa.toFixed(2) + ' m²';
  calcBsa.textContent = bsa.toFixed(2) + ' m²';
  formulaBtn.textContent = selectedFormula;
  formulaFooter.textContent = FORMULA_STRINGS[selectedFormula];

  if (amount !== null && bsa > 0) {
    calcResult.textContent = (bsa * amount).toFixed(2);
  } else {
    calcResult.textContent = '-';
  }
}

formulaBtn.addEventListener('click', () => {
  selectedFormula = selectedFormula === 'Dubois' ? 'Mosteller' : 'Dubois';
  recalc();
});

amountInput.addEventListener('input', () => {
  const value = parseNum(amountInput.value);
  if (value !== null) {
    if (value < 0) {
      setError(amountError, 'Amount cannot be negative');
      amount = null;
    } else if (value > 10000) {
      setError(amountError, 'Amount must be less than 10,000');
      amount = null;
    } else if (!Number.isFinite(value)) {
      setError(amountError, 'Invalid number entered');
      amount = null;
    } else {
      setError(amountError, null);
      amount = value;
    }
  } else {
    setError(amountError, null);
    amount = null;
  }
  recalc();
});

renderHeightInput(heightContainer, recalc);
renderWeightInput(weightContainer, recalc);
recalc();

wireResetButton(document.getElementById('resetBtn'), () => {
  Patient.reset();
});
</script>
</body>
</html>
