<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Misc Calculators - Onc Tools</title>
<link rel="stylesheet" href="css/style.css">
<script src="js/state.js"></script>
<script src="js/ui.js"></script>
<script>initChrome();</script>
</head>
<body>
<div class="page">
  <div id="pageHeader"></div>
  <main>
    <div class="card">
      <div class="card-header">Labs</div>
      <a class="link-row" href="anc.html">Absolute Neutrophil Count</a>
      <a class="link-row" href="calcium.html">Corrected Calcium</a>
      <a class="link-row" href="gfr.html">Creatinine Clearance / eGFR</a>
    </div>

    <div class="card">
      <div class="card-header">Conversions</div>
      <div id="heightContainer"></div>
      <div id="weightContainer"></div>
      <div id="tempContainer"></div>
    </div>
  </main>
</div>

<script>
let temperature = null;

renderHeader(document.getElementById('pageHeader'), {
  active: 'misc',
  title: 'Misc Calculators',
  onReset: () => {
    Patient.height = null;
    Patient.weight = null;
    temperature = null;
  }
});

renderHeightInput(document.getElementById('heightContainer'));
renderWeightInput(document.getElementById('weightContainer'));
renderTemperatureInput(
  document.getElementById('tempContainer'),
  () => temperature,
  (v) => { temperature = v; }
);
</script>
</body>
</html>
