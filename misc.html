<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Misc Calculators - Onc Tools</title>
<link rel="stylesheet" href="css/style.css">
<script src="js/state.js"></script>
<script src="js/ui.js"></script>
<script src="js/calculators.js"></script>
<script>initChrome();</script>
</head>
<body>
<div class="page">
  <div id="pageHeader"></div>
  <nav class="subtabbar">
    <button class="subtab" type="button" id="ancTab">ANC</button>
    <button class="subtab" type="button" id="calciumTab">Calcium</button>
    <button class="subtab" type="button" id="gfrTab">CrCl / eGFR</button>
    <button class="subtab" type="button" id="conversionsTab">Conversions</button>
  </nav>
  <main>
    <div id="ancPanel"></div>
    <div id="calciumPanel" hidden></div>
    <div id="gfrPanel" hidden></div>
    <div id="conversionsPanel" hidden></div>
    <div id="resetContainer"></div>
  </main>
</div>

<script>
let temperature = null;

renderHeader(document.getElementById('pageHeader'), { active: 'misc' });
renderResetButton(document.getElementById('resetContainer'), () => {
  Patient.height = null;
  Patient.weight = null;
  Patient.serumCalcium = null;
  Patient.albumin = null;
  temperature = null;
});

function renderConversionsPanel(container) {
  const heightContainer = el('div');
  const weightContainer = el('div');
  const tempContainer = el('div');
  container.appendChild(el('div', { class: 'card' }, [
    el('div', { class: 'card-header', text: 'Conversions' }),
    heightContainer,
    weightContainer,
    tempContainer
  ]));
  renderHeightInput(heightContainer);
  renderWeightInput(weightContainer);
  renderTemperatureInput(tempContainer, () => temperature, (v) => { temperature = v; });
}

setupSubtabs([
  { tabId: 'ancTab', panelId: 'ancPanel', renderFn: (panel) => renderANCCalculator(panel) },
  { tabId: 'calciumTab', panelId: 'calciumPanel', renderFn: (panel) => renderCorrectedCalciumCalculator(panel) },
  { tabId: 'gfrTab', panelId: 'gfrPanel', renderFn: (panel) => renderCrClEgfrCalculator(panel) },
  { tabId: 'conversionsTab', panelId: 'conversionsPanel', renderFn: renderConversionsPanel }
]);
</script>
</body>
</html>
