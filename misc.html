<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Misc Calculators - Onc Tools</title>
<link rel="stylesheet" href="css/style.css">
<script src="js/state.js"></script>
<script src="js/ui.js"></script>
<script src="js/calculators.js"></script>
<script>initChrome();</script>
</head>
<body>
<div class="page">
  <div id="pageHeader"></div>
  <main>
    <div class="card">
      <div class="card-header">Labs</div>

      <div class="accordion-item">
        <button class="accordion-toggle" type="button" id="ancToggle" aria-expanded="false">
          <span>Absolute Neutrophil Count</span>
          <span class="chevron">›</span>
        </button>
        <div class="accordion-panel" id="ancPanel" hidden></div>
      </div>

      <div class="accordion-item">
        <button class="accordion-toggle" type="button" id="calciumToggle" aria-expanded="false">
          <span>Corrected Calcium</span>
          <span class="chevron">›</span>
        </button>
        <div class="accordion-panel" id="calciumPanel" hidden></div>
      </div>

      <div class="accordion-item">
        <button class="accordion-toggle" type="button" id="gfrToggle" aria-expanded="false">
          <span>Creatinine Clearance / eGFR</span>
          <span class="chevron">›</span>
        </button>
        <div class="accordion-panel" id="gfrPanel" hidden></div>
      </div>
    </div>

    <div class="card">
      <div class="card-header">Conversions</div>
      <div id="heightContainer"></div>
      <div id="weightContainer"></div>
      <div id="tempContainer"></div>
    </div>
    <div id="resetContainer"></div>
  </main>
</div>

<script>
let temperature = null;

renderHeader(document.getElementById('pageHeader'), { active: 'misc' });
renderResetButton(document.getElementById('resetContainer'), () => {
  Patient.height = null;
  Patient.weight = null;
  Patient.serumCalcium = null;
  Patient.albumin = null;
  temperature = null;
});

renderHeightInput(document.getElementById('heightContainer'));
renderWeightInput(document.getElementById('weightContainer'));
renderTemperatureInput(
  document.getElementById('tempContainer'),
  () => temperature,
  (v) => { temperature = v; }
);

function setupAccordion(toggleId, panelId, renderFn) {
  const toggle = document.getElementById(toggleId);
  const panel = document.getElementById(panelId);
  let initialized = false;

  toggle.addEventListener('click', () => {
    const isOpen = toggle.getAttribute('aria-expanded') === 'true';
    if (!isOpen && !initialized) {
      renderFn(panel);
      initialized = true;
    }
    toggle.setAttribute('aria-expanded', String(!isOpen));
    panel.hidden = isOpen;
  });
}

setupAccordion('ancToggle', 'ancPanel', (panel) => renderANCCalculator(panel, { standalone: false }));
setupAccordion('calciumToggle', 'calciumPanel', (panel) => renderCorrectedCalciumCalculator(panel, { standalone: false }));
setupAccordion('gfrToggle', 'gfrPanel', (panel) => renderCrClEgfrCalculator(panel, { standalone: false }));
</script>
</body>
</html>
