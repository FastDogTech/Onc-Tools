<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Misc Calculators - Onc Tools</title>
<link rel="stylesheet" href="css/style.css">
<link rel="icon" type="image/png" href="img/favicon-32.png">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Onc Tools">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#007AFF">
<script src="js/state.js"></script>
<script src="js/ui.js"></script>
<script src="js/calculators.js"></script>
<script>initChrome();</script>
</head>
<body>
<div class="page">
  <div id="pageHeader"></div>
  <nav class="subtabbar">
    <button class="subtab" type="button" id="ancTab">ANC</button>
    <button class="subtab" type="button" id="calciumTab">Calcium</button>
    <button class="subtab" type="button" id="gfrTab">CrCl / eGFR</button>
    <button class="subtab" type="button" id="conversionsTab">Units</button>
  </nav>
  <main>
    <div id="ancPanel"></div>
    <div id="calciumPanel" hidden></div>
    <div id="gfrPanel" hidden></div>
    <div id="conversionsPanel" hidden></div>
    <div id="resetContainer"></div>
    <div id="formulaNotes"></div>
  </main>
</div>

<script>
let temperature = null;

renderHeader(document.getElementById('pageHeader'), { active: 'misc' });
renderResetButton(document.getElementById('resetContainer'), () => {
  Patient.height = null;
  Patient.weight = null;
  Patient.serumCalcium = null;
  Patient.albumin = null;
  temperature = null;
});

function renderConversionsPanel(container) {
  const heightContainer = el('div');
  const weightContainer = el('div');
  const tempContainer = el('div');
  container.appendChild(el('div', { class: 'card no-dividers' }, [
    heightContainer,
    weightContainer,
    tempContainer
  ]));
  renderHeightInput(heightContainer);
  renderWeightInput(weightContainer);
  renderTemperatureInput(tempContainer, () => temperature, (v) => { temperature = v; });
}

setupSubtabs([
  {
    tabId: 'ancTab', panelId: 'ancPanel',
    renderFn: (panel) => renderANCCalculator(panel),
    notes: ['ANC = WBC × ((Neutrophils + Bands) / 100)']
  },
  {
    tabId: 'calciumTab', panelId: 'calciumPanel',
    renderFn: (panel) => renderCorrectedCalciumCalculator(panel),
    notes: ['Corrected Ca = Serum Ca + 0.8 × (4.0 - Albumin)']
  },
  {
    tabId: 'gfrTab', panelId: 'gfrPanel',
    renderFn: (panel) => renderCrClEgfrCalculator(panel),
    notes: [
      'Cockcroft-Gault: CrCl = ((140 - age) × weight × (0.85 if female)) / (72 × SCr)',
      'MDRD: GFR = 175 × (SCr)^-1.154 × (Age)^-0.203 × (0.742 if female)'
    ]
  },
  {
    tabId: 'conversionsTab', panelId: 'conversionsPanel',
    renderFn: renderConversionsPanel,
    notes: [
      'Height: cm = in × 2.54',
      'Weight: kg = lbs / 2.2046',
      'Temperature: °F = (°C × 9/5) + 32'
    ]
  }
], document.getElementById('formulaNotes'));
</script>
</body>
</html>
