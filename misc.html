<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Misc Calculators - Onc Tools</title>
<link rel="stylesheet" href="css/style.css">
<script src="js/state.js"></script>
<script src="js/ui.js"></script>
<script src="js/calculators.js"></script>
<script>initChrome();</script>
</head>
<body>
<div class="page">
  <div id="pageHeader"></div>
  <main>
    <div class="card">
      <div class="accordion-item">
        <button class="accordion-toggle" type="button" id="ancToggle" aria-expanded="false">
          <span>Absolute Neutrophil Count</span>
          <span class="chevron">›</span>
        </button>
        <div class="accordion-panel" id="ancPanel" hidden></div>
      </div>

      <div class="accordion-item">
        <button class="accordion-toggle" type="button" id="calciumToggle" aria-expanded="false">
          <span>Corrected Calcium</span>
          <span class="chevron">›</span>
        </button>
        <div class="accordion-panel" id="calciumPanel" hidden></div>
      </div>

      <div class="accordion-item">
        <button class="accordion-toggle" type="button" id="gfrToggle" aria-expanded="false">
          <span>Creatinine Clearance / eGFR</span>
          <span class="chevron">›</span>
        </button>
        <div class="accordion-panel" id="gfrPanel" hidden></div>
      </div>

      <div class="accordion-item">
        <button class="accordion-toggle" type="button" id="conversionsToggle" aria-expanded="false">
          <span>Unit Conversions</span>
          <span class="chevron">›</span>
        </button>
        <div class="accordion-panel" id="conversionsPanel" hidden></div>
      </div>
    </div>
    <div id="resetContainer"></div>
  </main>
</div>

<script>
let temperature = null;

renderHeader(document.getElementById('pageHeader'), { active: 'misc' });
renderResetButton(document.getElementById('resetContainer'), () => {
  Patient.height = null;
  Patient.weight = null;
  Patient.serumCalcium = null;
  Patient.albumin = null;
  temperature = null;
});

function setupAccordion(items) {
  const entries = items.map(item => ({
    ...item,
    toggle: document.getElementById(item.toggleId),
    panel: document.getElementById(item.panelId),
    initialized: false
  }));

  entries.forEach(entry => {
    entry.toggle.addEventListener('click', () => {
      const isOpen = entry.toggle.getAttribute('aria-expanded') === 'true';

      entries.forEach(other => {
        if (other !== entry) {
          other.toggle.setAttribute('aria-expanded', 'false');
          other.panel.hidden = true;
        }
      });

      if (!isOpen && !entry.initialized) {
        entry.renderFn(entry.panel);
        entry.initialized = true;
      }
      entry.toggle.setAttribute('aria-expanded', String(!isOpen));
      entry.panel.hidden = isOpen;
    });
  });
}

setupAccordion([
  { toggleId: 'ancToggle', panelId: 'ancPanel', renderFn: (panel) => renderANCCalculator(panel, { standalone: false }) },
  { toggleId: 'calciumToggle', panelId: 'calciumPanel', renderFn: (panel) => renderCorrectedCalciumCalculator(panel, { standalone: false }) },
  { toggleId: 'gfrToggle', panelId: 'gfrPanel', renderFn: (panel) => renderCrClEgfrCalculator(panel, { standalone: false }) },
  {
    toggleId: 'conversionsToggle', panelId: 'conversionsPanel', renderFn: (panel) => {
      const heightContainer = el('div');
      const weightContainer = el('div');
      const tempContainer = el('div');
      panel.appendChild(heightContainer);
      panel.appendChild(weightContainer);
      panel.appendChild(tempContainer);
      renderHeightInput(heightContainer);
      renderWeightInput(weightContainer);
      renderTemperatureInput(tempContainer, () => temperature, (v) => { temperature = v; });
    }
  }
]);
</script>
</body>
</html>
